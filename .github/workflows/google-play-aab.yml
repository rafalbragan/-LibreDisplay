name: Google Play AAB release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    name: Build signed Play App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Enforce protected release source
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" != "master" ]; then
            echo "::error::Release bundles must be built from master after human merge."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Check release signing configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done

      - name: Build signed release AAB
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$(mktemp "${RUNNER_TEMP}/librecare-upload-key.XXXXXX.jks")"
          cleanup() { rm -f "$keyfile"; }
          trap cleanup EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          chmod +x ./gradlew
          RELEASE_STORE_FILE="$keyfile" ./gradlew --no-daemon :app:bundleRelease
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab" || { echo "::error::Missing release AAB"; exit 1; }
          jarsigner -verify "$aab"
          mkdir -p release-evidence
          sha256sum "$aab" > release-evidence/app-release.aab.sha256
          printf 'commit=%s\nref=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > release-evidence/source.txt

      - name: Upload AAB and evidence
        uses: actions/upload-artifact@v4
        with:
          name: LibreCare-GooglePlay-release-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            release-evidence/**
          if-no-files-found: error
          retention-days: 14
