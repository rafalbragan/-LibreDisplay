name: Firebase Test Lab

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale (validated against Test Lab locales)"
        required: false
        default: "pl"
      orientation:
        description: "Device orientation"
        required: false
        type: choice
        default: "portrait"
        options:
          - portrait
          - landscape
          - default

# Workload Identity Federation requires an OIDC token from GitHub.
permissions:
  contents: read
  id-token: write

jobs:
  firebase-test-lab:
    name: Build and run Firebase Test Lab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      FTL_SMALL_MODEL: ${{ vars.FTL_SMALL_MODEL }}
      FTL_SMALL_VERSION: ${{ vars.FTL_SMALL_VERSION }}
      FTL_STANDARD_MODEL: ${{ vars.FTL_STANDARD_MODEL }}
      FTL_STANDARD_VERSION: ${{ vars.FTL_STANDARD_VERSION }}
      FTL_LARGE_MODEL: ${{ vars.FTL_LARGE_MODEL }}
      FTL_LARGE_VERSION: ${{ vars.FTL_LARGE_VERSION }}
      LOCALE: ${{ github.event.inputs.locale || 'pl' }}
      ORIENTATION: ${{ github.event.inputs.orientation || 'portrait' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/*.sh

      - name: Verify build environment
        run: bash ./scripts/verify-environment.sh

      # ------------------------------------------------------------------
      # BUILD: fresh debug + androidTest APKs (never reuse release-artifacts)
      # ------------------------------------------------------------------
      - name: Build app debug APK
        id: build-app
        run: ./gradlew clean :app:assembleDebug --stacktrace

      - name: Build androidTest APK
        id: build-androidtest
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Detect APK paths
        id: apks
        shell: bash
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"

          if [ ! -f "$DEBUG_APK" ]; then
            DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*debug*.apk" | sort | head -n 1)
          fi
          if [ ! -f "$TEST_APK" ]; then
            TEST_APK=$(find app/build/outputs/apk/androidTest -type f -name "*androidTest*.apk" | sort | head -n 1)
          fi

          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found"
            exit 1
          fi
          if [ ! -f "$TEST_APK" ]; then
            echo "::error::AndroidTest APK not found"
            exit 1
          fi

          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "test_apk=$TEST_APK" >> "$GITHUB_OUTPUT"

      - name: Upload built APKs
        uses: actions/upload-artifact@v4
        with:
          name: librecare-firebase-build-artifacts
          path: |
            ${{ steps.apks.outputs.debug_apk }}
            ${{ steps.apks.outputs.test_apk }}
            app/build/reports/**
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------------
      # CONFIG CHECK: verify the three required GCP repository variables.
      # Missing variables => Firebase steps are natively skipped (not FAIL).
      # ------------------------------------------------------------------
      - name: Check Firebase configuration
        id: firebase-config
        shell: bash
        run: |
          missing=""
          [ -z "$GCP_PROJECT_ID" ] && missing="${missing}GCP_PROJECT_ID "
          [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && missing="${missing}GCP_WORKLOAD_IDENTITY_PROVIDER "
          [ -z "$GCP_SERVICE_ACCOUNT" ] && missing="${missing}GCP_SERVICE_ACCOUNT "

          missing=$(echo "$missing" | sed 's/[[:space:]]*$//')

          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "missing_vars=${missing}" >> "$GITHUB_OUTPUT"
            echo "Firebase Test Lab will be SKIPPED. Missing repository variables: ${missing}"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "missing_vars=" >> "$GITHUB_OUTPUT"
            echo "Firebase configuration present."
          fi

      # ------------------------------------------------------------------
      # AUTH: Workload Identity Federation (no long-lived JSON key)
      # ------------------------------------------------------------------
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        if: ${{ steps.firebase-config.outputs.enabled == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        id: setup-gcloud
        if: ${{ steps.firebase-config.outputs.enabled == 'true' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 417.0.0'

      # ------------------------------------------------------------------
      # DEVICE SELECTION (DYNAMIC): resolve THREE distinct virtual phones
      # (SMALL, STANDARD, LARGE) purely from the live Test Lab catalog.
      # Classification is by REAL screen width in dp computed from
      # screenX/screenY/screenDensity — never from a marketing model name.
      # ------------------------------------------------------------------
      - name: Select and validate 3-device matrix (dynamic)
        id: device
        if: ${{ steps.firebase-config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null

          # 1) Pull the live VIRTUAL model catalog as JSON.
          CATALOG_JSON=$(gcloud firebase test android models list --filter=virtual --format=json)

          # Phones only: form==VIRTUAL, formFactor==PHONE (an EMPTY formFactor is NOT a phone),
          # exclude deprecated, require positive screen geometry. widthDp is computed for portrait:
          #   shortSidePx = min(screenX, screenY)
          #   widthDp     = shortSidePx * 160 / screenDensity
          PHONES_TSV=$(echo "$CATALOG_JSON" | jq -r '
            .[]
            | select((.form // "") == "VIRTUAL")
            | select((.formFactor // "") == "PHONE")
            | select( ( [ .tags[]? | ascii_downcase ] | any(test("deprecated")) ) | not )
            | select((.screenX // 0) > 0 and (.screenY // 0) > 0 and (.screenDensity // 0) > 0)
            | [ .id,
                ( [ .screenX, .screenY ] | min ),
                .screenDensity,
                ( ( ( [ .screenX, .screenY ] | min ) * 160 / .screenDensity ) | floor ),
                ( [ .supportedVersionIds[]? ] | join(",") )
              ] | @tsv
          ')

          if [ -z "$PHONES_TSV" ]; then
            echo "::error::No VIRTUAL PHONE models with usable screen geometry were returned by the catalog."
            exit 1
          fi

          echo "Phone catalog (id / shortPx / density / widthDp / supportedVersions):"
          echo "$PHONES_TSV"

          TAB=$(printf '\t')

          # --- helpers -------------------------------------------------------
          record_for() { echo "$PHONES_TSV" | awk -F "$TAB" -v id="$1" '$1==id {print; exit}'; }
          supports() { echo ",$1," | grep -q ",$2,"; }         # supports "<csv>" "<api>"
          # Per-model API preference: 35 -> 34 -> 33 -> 32 -> highest stable supported by THIS model.
          pick_version() {
            local csv="$1" v
            for v in 35 34 33 32; do
              if supports "$csv" "$v"; then echo "$v"; return 0; fi
            done
            echo "$csv" | tr ',' '\n' | grep -E '^[0-9]+$' | sort -n | tail -n 1
          }

          USED=""
          is_used() { echo " $USED " | grep -q " $1 "; }
          mark_used() { USED="$USED $1"; }

          SORTED_ASC=$(echo "$PHONES_TSV" | sort -t "$TAB" -k4,4n)

          declare -A SEL_MODEL SEL_PX SEL_DENS SEL_WDP SEL_VER SEL_SRC

          set_profile() {
            local p="$1" rec="$2" ver="$3" src="$4"
            SEL_MODEL[$p]=$(echo "$rec" | cut -f1)
            SEL_PX[$p]=$(echo "$rec" | cut -f2)
            SEL_DENS[$p]=$(echo "$rec" | cut -f3)
            SEL_WDP[$p]=$(echo "$rec" | cut -f4)
            SEL_VER[$p]="$ver"
            SEL_SRC[$p]="$src"
            mark_used "${SEL_MODEL[$p]}"
          }

          # Repository-variable override: accepted ONLY if the model is an available VIRTUAL phone
          # whose supportedVersionIds include the requested API. Otherwise a warning + fallback.
          apply_override() {
            local p="$1" model="$2" version="$3" rec csv
            [ -n "$model" ] && [ -n "$version" ] || return 0
            rec=$(record_for "$model")
            if [ -z "$rec" ]; then
              echo "::warning::${p}: override model '$model' is not an available VIRTUAL phone; using fallback."
              return 0
            fi
            csv=$(echo "$rec" | cut -f5)
            if ! supports "$csv" "$version"; then
              echo "::warning::${p}: override model '$model' does not support API '$version'; using fallback."
              return 0
            fi
            if is_used "$model"; then
              echo "::warning::${p}: override model '$model' already used by another profile; using fallback."
              return 0
            fi
            set_profile "$p" "$rec" "$version" "repository-variables"
          }

          # SMALL: smallest sensible widthDp (>=200 preferred), else smallest overall.
          auto_small() {
            local line
            line=$(echo "$SORTED_ASC" | awk -F "$TAB" -v u="$USED" '
              BEGIN{n=split(u,a," ");for(i=1;i<=n;i++)used[a[i]]=1}
              $1 in used {next} $4>=200 {print; exit}')
            [ -n "$line" ] || line=$(echo "$SORTED_ASC" | awk -F "$TAB" -v u="$USED" '
              BEGIN{n=split(u,a," ");for(i=1;i<=n;i++)used[a[i]]=1} $1 in used{next}{print; exit}')
            [ -n "$line" ] || { echo "::error::SMALL: no available phone."; exit 1; }
            set_profile SMALL "$line" "$(pick_version "$(echo "$line" | cut -f5)")" "fallback-auto"
          }

          # LARGE: largest widthDp phone still classified as PHONE, distinct from the others.
          auto_large() {
            local line
            line=$(echo "$SORTED_ASC" | awk -F "$TAB" -v u="$USED" '
              BEGIN{n=split(u,a," ");for(i=1;i<=n;i++)used[a[i]]=1}
              $1 in used{next}{last=$0} END{if(last!="")print last}')
            [ -n "$line" ] || { echo "::error::LARGE: no available phone distinct from the others."; exit 1; }
            set_profile LARGE "$line" "$(pick_version "$(echo "$line" | cut -f5)")" "fallback-auto"
          }

          # STANDARD: widthDp closest to 384; tie-break prefers API 35 then 34.
          auto_standard() {
            local line
            line=$(echo "$PHONES_TSV" | awk -F "$TAB" -v u="$USED" '
              BEGIN{n=split(u,a," ");for(i=1;i<=n;i++)used[a[i]]=1}
              $1 in used {next}
              { d=$4-384; if(d<0)d=-d; sc=2; v=","$5","; if(index(v,",35,")>0)sc=0; else if(index(v,",34,")>0)sc=1;
                printf "%d\t%d\t%s\n", d, sc, $0 }' \
              | sort -t "$TAB" -k1,1n -k2,2n | head -n 1 | cut -f3-)
            [ -n "$line" ] || { echo "::error::STANDARD: no available phone distinct from the others."; exit 1; }
            set_profile STANDARD "$line" "$(pick_version "$(echo "$line" | cut -f5)")" "fallback-auto"
          }

          # Overrides first (so their ids are reserved), then automatic fill for the rest.
          apply_override SMALL    "${FTL_SMALL_MODEL:-}"    "${FTL_SMALL_VERSION:-}"
          apply_override STANDARD "${FTL_STANDARD_MODEL:-}" "${FTL_STANDARD_VERSION:-}"
          apply_override LARGE    "${FTL_LARGE_MODEL:-}"    "${FTL_LARGE_VERSION:-}"

          [ -n "${SEL_MODEL[SMALL]:-}" ]    || auto_small
          [ -n "${SEL_MODEL[LARGE]:-}" ]    || auto_large
          [ -n "${SEL_MODEL[STANDARD]:-}" ] || auto_standard

          # --- distinctness + per-model API validity guard ------------------
          if [ "${SEL_MODEL[SMALL]}" = "${SEL_MODEL[STANDARD]}" ] || \
             [ "${SEL_MODEL[SMALL]}" = "${SEL_MODEL[LARGE]}" ] || \
             [ "${SEL_MODEL[STANDARD]}" = "${SEL_MODEL[LARGE]}" ]; then
            echo "::error::device selection produced non-distinct models: ${SEL_MODEL[SMALL]}, ${SEL_MODEL[STANDARD]}, ${SEL_MODEL[LARGE]}"
            exit 1
          fi
          for p in SMALL STANDARD LARGE; do
            csv=$(record_for "${SEL_MODEL[$p]}" | cut -f5)
            if ! supports "$csv" "${SEL_VER[$p]}"; then
              echo "::error::${p}: model ${SEL_MODEL[$p]} does not support API ${SEL_VER[$p]}"
              exit 1
            fi
          done

          # Locale validation against the live Test Lab locale catalog.
          if ! gcloud firebase test android locales list --format="value(id)" | grep -qx "$LOCALE"; then
            echo "::error::Locale '$LOCALE' is not supported by Firebase Test Lab."
            exit 1
          fi
          # Orientation must be one of the Test Lab supported values.
          case "$ORIENTATION" in
            portrait|landscape|default) ;;
            *) echo "::error::Orientation '$ORIENTATION' is invalid (allowed: portrait|landscape|default)."; exit 1 ;;
          esac

          # --- outputs (model/version + geometry for the diagnostic table) --
          {
            echo "small_model=${SEL_MODEL[SMALL]}";       echo "small_version=${SEL_VER[SMALL]}"
            echo "small_px=${SEL_PX[SMALL]}";             echo "small_density=${SEL_DENS[SMALL]}"
            echo "small_widthdp=${SEL_WDP[SMALL]}";       echo "small_source=${SEL_SRC[SMALL]}"
            echo "standard_model=${SEL_MODEL[STANDARD]}"; echo "standard_version=${SEL_VER[STANDARD]}"
            echo "standard_px=${SEL_PX[STANDARD]}";       echo "standard_density=${SEL_DENS[STANDARD]}"
            echo "standard_widthdp=${SEL_WDP[STANDARD]}"; echo "standard_source=${SEL_SRC[STANDARD]}"
            echo "large_model=${SEL_MODEL[LARGE]}";       echo "large_version=${SEL_VER[LARGE]}"
            echo "large_px=${SEL_PX[LARGE]}";             echo "large_density=${SEL_DENS[LARGE]}"
            echo "large_widthdp=${SEL_WDP[LARGE]}";       echo "large_source=${SEL_SRC[LARGE]}"
          } >> "$GITHUB_OUTPUT"

          # --- diagnostic table (log) ---------------------------------------
          echo "Dobor urzadzen (dynamiczny, wg widthDp):"
          printf '| %-8s | %-18s | %-6s | %-7s | %-7s | %-3s | %-18s |\n' "Profil" "Model" "px" "density" "widthDp" "API" "Zrodlo"
          printf '| %-8s | %-18s | %-6s | %-7s | %-7s | %-3s | %-18s |\n' \
            "SMALL" "${SEL_MODEL[SMALL]}" "${SEL_PX[SMALL]}" "${SEL_DENS[SMALL]}" "${SEL_WDP[SMALL]}" "${SEL_VER[SMALL]}" "${SEL_SRC[SMALL]}"
          printf '| %-8s | %-18s | %-6s | %-7s | %-7s | %-3s | %-18s |\n' \
            "STANDARD" "${SEL_MODEL[STANDARD]}" "${SEL_PX[STANDARD]}" "${SEL_DENS[STANDARD]}" "${SEL_WDP[STANDARD]}" "${SEL_VER[STANDARD]}" "${SEL_SRC[STANDARD]}"
          printf '| %-8s | %-18s | %-6s | %-7s | %-7s | %-3s | %-18s |\n' \
            "LARGE" "${SEL_MODEL[LARGE]}" "${SEL_PX[LARGE]}" "${SEL_DENS[LARGE]}" "${SEL_WDP[LARGE]}" "${SEL_VER[LARGE]}" "${SEL_SRC[LARGE]}"

          echo "READY_FOR_DYNAMIC_3_DEVICE_MATRIX: YES"

      # ------------------------------------------------------------------
      # RUN: instrumentation tests on Firebase Test Lab as ONE matrix that
      # contains all three device executions (small/standard/large).
      # A failure on ANY device fails the whole step (propagated exit code).
      # ------------------------------------------------------------------
      - name: Run Firebase Test Lab matrix
        id: ftl
        if: ${{ steps.firebase-config.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          RESULTS_DIR="librecare-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"

          # Do not let post-processing hide a Test Lab failure: capture gcloud's real exit code.
          set +e
          gcloud firebase test android run \
            --project="$GCP_PROJECT_ID" \
            --type=instrumentation \
            --app="${{ steps.apks.outputs.debug_apk }}" \
            --test="${{ steps.apks.outputs.test_apk }}" \
            --device="model=${{ steps.device.outputs.small_model }},version=${{ steps.device.outputs.small_version }},locale=${LOCALE},orientation=${ORIENTATION}" \
            --device="model=${{ steps.device.outputs.standard_model }},version=${{ steps.device.outputs.standard_version }},locale=${LOCALE},orientation=${ORIENTATION}" \
            --device="model=${{ steps.device.outputs.large_model }},version=${{ steps.device.outputs.large_version }},locale=${LOCALE},orientation=${ORIENTATION}" \
            --results-dir="$RESULTS_DIR" \
            --timeout=15m 2>&1 | tee ftl-output.log
          FTL_EXIT=${PIPESTATUS[0]}
          set -e

          # Extract result links even when the run failed, so they still appear in the summary.
          RESULTS_URL=$(grep -Eo 'https://console.firebase.google.com[^ ]*' ftl-output.log | head -n 1 || true)
          GCS_URL=$(grep -Eo 'gs://[^ ]*' ftl-output.log | head -n 1 || true)
          echo "results_url=${RESULTS_URL}" >> "$GITHUB_OUTPUT"
          echo "gcs_url=${GCS_URL}" >> "$GITHUB_OUTPUT"

          echo "Firebase Test Lab exit code: ${FTL_EXIT}"
          # Propagate the exact Test Lab exit code so a failing instrumentation run fails the job.
          exit "$FTL_EXIT"

      - name: Upload Firebase Test Lab log
        if: ${{ always() && steps.firebase-config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: librecare-firebase-testlab-log
          path: ftl-output.log
          if-no-files-found: ignore
          retention-days: 14

      # ------------------------------------------------------------------
      # JOB SUMMARY: reflects the ACTUAL outcome of each step.
      # ------------------------------------------------------------------
      - name: Job Summary
        if: ${{ always() }}
        shell: bash
        run: |
          status() {
            case "$1" in
              success) echo "PASS ✅" ;;
              failure) echo "FAIL ❌" ;;
              skipped) echo "SKIPPED ⏭️" ;;
              "") echo "SKIPPED ⏭️" ;;
              *) echo "$1" ;;
            esac
          }

          ENABLED="${{ steps.firebase-config.outputs.enabled }}"
          MISSING="${{ steps.firebase-config.outputs.missing_vars }}"

          AUTH_OUTCOME="${{ steps.auth.outcome }}"
          DEVICE_OUTCOME="${{ steps.device.outcome }}"
          APP_BUILD="${{ steps.build-app.outcome }}"
          TEST_BUILD="${{ steps.build-androidtest.outcome }}"
          FTL_OUTCOME="${{ steps.ftl.outcome }}"

          SMALL_MODEL="${{ steps.device.outputs.small_model }}"
          SMALL_VER="${{ steps.device.outputs.small_version }}"
          SMALL_PX="${{ steps.device.outputs.small_px }}"
          SMALL_DENS="${{ steps.device.outputs.small_density }}"
          SMALL_WDP="${{ steps.device.outputs.small_widthdp }}"
          STD_MODEL="${{ steps.device.outputs.standard_model }}"
          STD_VER="${{ steps.device.outputs.standard_version }}"
          STD_PX="${{ steps.device.outputs.standard_px }}"
          STD_DENS="${{ steps.device.outputs.standard_density }}"
          STD_WDP="${{ steps.device.outputs.standard_widthdp }}"
          LARGE_MODEL="${{ steps.device.outputs.large_model }}"
          LARGE_VER="${{ steps.device.outputs.large_version }}"
          LARGE_PX="${{ steps.device.outputs.large_px }}"
          LARGE_DENS="${{ steps.device.outputs.large_density }}"
          LARGE_WDP="${{ steps.device.outputs.large_widthdp }}"
          RESULTS_URL="${{ steps.ftl.outputs.results_url }}"
          GCS_URL="${{ steps.ftl.outputs.gcs_url }}"

          # Precise Firebase Test Lab status: config vs auth vs device-selection vs real run.
          if [ "$ENABLED" != "true" ]; then
            FTL_LINE="SKIPPED_EXTERNAL_CONFIGURATION"
          elif [ "$AUTH_OUTCOME" = "failure" ]; then
            FTL_LINE="NOT_RUN_AUTH_FAILED ❌"
          elif [ "$DEVICE_OUTCOME" = "failure" ]; then
            FTL_LINE="NOT_RUN_DEVICE_SELECTION_FAILED ❌"
          elif [ "$FTL_OUTCOME" = "success" ]; then
            FTL_LINE="PASS ✅"
          elif [ "$FTL_OUTCOME" = "failure" ]; then
            FTL_LINE="FAIL ❌"
          else
            FTL_LINE="NOT_RUN ❌"
          fi

          {
            echo "## LibreCare — Firebase Test Lab (3-device matrix)"
            echo ""
            echo "| Krok | Wynik |"
            echo "|------|-------|"
            echo "| App APK build | $(status "$APP_BUILD") |"
            echo "| androidTest APK build | $(status "$TEST_BUILD") |"
            echo "| Authentication (Workload Identity) | $( [ "$ENABLED" = "true" ] && status "$AUTH_OUTCOME" || echo 'SKIPPED ⏭️' ) |"
            echo "| Device selection | $( [ "$ENABLED" = "true" ] && status "$DEVICE_OUTCOME" || echo 'SKIPPED ⏭️' ) |"
            echo "| Firebase Test Lab matrix | $FTL_LINE |"
            echo ""
            echo "### Macierz urządzeń (widthDp policzone z screenX/screenY/screenDensity)"
            echo ""
            echo "| Profil | Model | px | density | widthDp | API | Locale | Orientation |"
            echo "|--------|-------|----|---------|---------|-----|--------|-------------|"
            echo "| SMALL | ${SMALL_MODEL:-n/d} | ${SMALL_PX:-n/d} | ${SMALL_DENS:-n/d} | ${SMALL_WDP:-n/d} | ${SMALL_VER:-n/d} | ${LOCALE} | ${ORIENTATION} |"
            echo "| STANDARD | ${STD_MODEL:-n/d} | ${STD_PX:-n/d} | ${STD_DENS:-n/d} | ${STD_WDP:-n/d} | ${STD_VER:-n/d} | ${LOCALE} | ${ORIENTATION} |"
            echo "| LARGE | ${LARGE_MODEL:-n/d} | ${LARGE_PX:-n/d} | ${LARGE_DENS:-n/d} | ${LARGE_WDP:-n/d} | ${LARGE_VER:-n/d} | ${LOCALE} | ${ORIENTATION} |"
            echo ""
            echo "### Artefakty APK"
            echo ""
            echo "- App APK: \`${{ steps.apks.outputs.debug_apk }}\`"
            echo "- androidTest APK: \`${{ steps.apks.outputs.test_apk }}\`"
            echo ""
            echo "### Wyniki Test Lab"
            echo ""
            if [ -n "$RESULTS_URL" ]; then
              echo "- Konsola / result matrix: [$RESULTS_URL]($RESULTS_URL)"
            fi
            if [ -n "$GCS_URL" ]; then
              echo "- Bucket: \`$GCS_URL\`"
            fi
            if [ "$ENABLED" != "true" ]; then
              echo ""
              echo "> **Firebase Test Lab: SKIPPED_EXTERNAL_CONFIGURATION**"
              echo "> Brakujące Repository Variables: \`${MISSING}\`"
              echo "> Dodaj: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT"
            elif [ "$AUTH_OUTCOME" = "failure" ]; then
              echo ""
              echo "> **Firebase Test Lab: NOT_RUN_AUTH_FAILED ❌**"
              echo "> Uwierzytelnianie Workload Identity Federation nie powiodło się."
            elif [ "$DEVICE_OUTCOME" = "failure" ]; then
              echo ""
              echo "> **Firebase Test Lab: NOT_RUN_DEVICE_SELECTION_FAILED ❌**"
              echo "> Dynamiczny dobór urządzeń nie powiódł się — sprawdź krok „Select and validate 3-device matrix (dynamic)”."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report skipped Firebase execution
        if: ${{ steps.firebase-config.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "Firebase Test Lab: SKIPPED_EXTERNAL_CONFIGURATION"
          echo "Missing repository variables: ${{ steps.firebase-config.outputs.missing_vars }}"
          echo "Build artifacts were produced; Test Lab execution was skipped (not a failure)."

