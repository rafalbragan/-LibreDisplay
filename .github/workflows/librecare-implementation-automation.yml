name: LibreCare Implementation Automation

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
  workflow_run:
    workflows: ["Android CI", "Android APK Build"]
    types: [completed]

concurrency:
  group: product-foundation-state
  cancel-in-progress: false

jobs:
  bug-intake-triage:
    if: >-
      github.event_name == 'issues' &&
      (
        (
          startsWith(github.event.issue.title, '[Blad LibreCare]') ||
          startsWith(github.event.issue.title, '[Błąd LibreCare]')
        ) &&
        contains(github.event.issue.body, '### Co się stało?') &&
        contains(github.event.issue.body, '### Jakiego zachowania oczekiwałeś?') &&
        contains(github.event.issue.body, '### Jak odtworzyć problem?') &&
        contains(github.event.issue.body, '### Gdzie występuje?') &&
        contains(github.event.issue.body, '### Czy problem występował wcześniej?')
      )
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Import bug record
        run: |
          python scripts/product/automation_cli.py bug-import --event-file "$GITHUB_EVENT_PATH"

      - name: Detect bug id
        id: bug
        run: |
          python -c "import json; from pathlib import Path; issue_number=int('${{ github.event.issue.number }}'); bug_id=next((data.get('bug_id','') for p in sorted((Path('product')/'bugs').glob('BUG-*.json')) for data in [json.loads(p.read_text(encoding='utf-8'))] if data.get('source_issue_number')==issue_number), ''); Path('bug-id.txt').write_text(bug_id, encoding='utf-8')"
          echo "bug_id=$(cat bug-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Build triage prompt
        run: |
          python scripts/product/automation_cli.py bug-build-ai-prompt \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --output-file bug-ai-prompt.json

      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot

      - name: Copilot CLI smoke check
        run: |
          copilot --version
          copilot --help >/dev/null

      - name: Run Copilot bug triage (read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat bug-ai-prompt.json | copilot \
            -s \
            --no-ask-user \
            --disable-builtin-mcps \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --deny-tool='write' \
            --deny-tool='shell' \
            > bug-ai-review-raw.txt

      - name: Apply bug AI triage with deterministic governance
        run: |
          python scripts/product/automation_cli.py bug-apply-ai-triage \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --ai-review-file bug-ai-review-raw.txt > bug-triage-result.json

      - name: Determine if auto-fix is allowed
        id: triage
        run: |
          python -c "import json; from pathlib import Path; data=json.loads(Path('bug-triage-result.json').read_text(encoding='utf-8')); allowed=(data.get('classification')=='CONFIRMED_DEFECT'); Path('triage-allowed.txt').write_text('true' if allowed else 'false', encoding='utf-8'); print(f'allowed={str(allowed).lower()}')"
          echo "allowed=$(cat triage-allowed.txt)" >> "$GITHUB_OUTPUT"

      - name: Route to Product Inbox decision
        if: steps.triage.outputs.allowed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number(context.payload.issue.number);
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'product-inbox' });
            } catch (_err) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'product-inbox',
                color: '1f6feb',
                description: 'Zgłoszenia do skrzynki produktu LibreCare',
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: ['product-inbox'],
            });
            const marker = '<!-- LIBRECARE_BUG_PRODUCT_GATE -->';
            const body = `${marker}\n## LibreCare — decyzja wymagana\n\nZgłoszenie błędu zostało sklasyfikowane jako wymagające decyzji produktowej człowieka.\nAutomatyczna naprawa została zablokowana.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Attempt bug fix handoff for confirmed defects
        if: steps.triage.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/product/automation_cli.py bug-sync-fix-handoff \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --repo-owner="${{ github.repository_owner }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --github-token "$GITHUB_TOKEN" \
            --base-branch master \
            --output-file bug-handoff.json || true

      - name: Persist automation records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/bugs product/implementation product/generated
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: bug intake #${{ github.event.issue.number }}"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  track-work-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Track requirement/bug PR
        run: |
          python scripts/product/automation_cli.py track-work-pr \
            --event-file "$GITHUB_EVENT_PATH" \
            --output-file pr-track.json || true

      - name: Persist automation records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/bugs product/implementation product/generated product/requirements
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: track automation pr #${{ github.event.pull_request.number }}"
            git pull --rebase origin "${{ github.event.pull_request.base.ref }}"
            git push origin "HEAD:${{ github.event.pull_request.base.ref }}"
          fi

  master-ci-regression-intake:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      copilot-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Collect master CI regression metadata
        id: ci_regression
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wr = context.payload.workflow_run || {};
            const workflowName = String(wr.name || '');
            const conclusion = String(wr.conclusion || '').toLowerCase();
            const branch = String(wr.head_branch || '');
            const triggeringEvent = String(wr.event || '').toLowerCase();
            const recognized = new Set(['Android CI', 'Android APK Build']);
            const deterministicSignals = {
              'Android CI': ['Fast test suite', 'Run fast suite', 'Verify build environment'],
              'Android APK Build': ['Build debug APK', 'Build release APK', 'Fail if debug APK was not created'],
            };
            const jobs = recognized.has(workflowName)
              ? await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: Number(wr.id),
                  per_page: 100,
                })
              : [];
            const failedJobs = jobs.filter(job => String(job.conclusion || '').toLowerCase() === 'failure');
            let failedStep = '';
            for (const job of failedJobs) {
              const step = (job.steps || []).find(s => String(s.conclusion || '').toLowerCase() === 'failure');
              if (step) {
                failedStep = `${job.name}: ${step.name}`;
                break;
              }
            }
            const signalList = deterministicSignals[workflowName] || [];
            const deterministicWorkExecuted = jobs.some(job => {
              const haystack = [job.name, ...(job.steps || []).map(step => step.name)].join('\n');
              return signalList.some(signal => haystack.includes(signal));
            });
            const meta = {
              workflow_name: workflowName,
              conclusion,
              event: triggeringEvent,
              branch,
              run_id: String(wr.id || ''),
              run_url: String(wr.html_url || ''),
              head_sha: String(wr.head_sha || ''),
              failed_job: failedJobs[0] ? String(failedJobs[0].name || '') : '',
              failed_step: failedStep,
              log_excerpt: failedStep || (failedJobs[0] ? String(failedJobs[0].name || '') : ''),
              deterministic_work_executed: deterministicWorkExecuted,
            };
            fs.writeFileSync('ci-regression-context.json', JSON.stringify(meta));
            const shouldRoute = recognized.has(workflowName)
              && conclusion === 'failure'
              && ['master', 'main'].includes(branch)
              && triggeringEvent !== 'pull_request'
              && deterministicWorkExecuted;
            core.setOutput('should_route', shouldRoute ? 'true' : 'false');

      - name: Create canonical CI regression bug evidence
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          python scripts/product/automation_cli.py ci-regression-intake \
            --event-file "$GITHUB_EVENT_PATH" \
            --metadata-file ci-regression-context.json \
            --output-file ci-regression-result.json

      - name: Detect CI regression bug id
        if: steps.ci_regression.outputs.should_route == 'true'
        id: bug
        run: |
          python -c "import json; from pathlib import Path; data=json.loads(Path('ci-regression-result.json').read_text(encoding='utf-8')); Path('ci-regression-bug-id.txt').write_text(str(data.get('bug_id','')), encoding='utf-8')"
          echo "bug_id=$(cat ci-regression-bug-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Install GitHub Copilot CLI
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          npm install -g @github/copilot

      - name: Copilot CLI smoke check
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          copilot --version
          copilot --help >/dev/null

      - name: Build triage prompt for CI regression bug
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          python scripts/product/automation_cli.py bug-build-ai-prompt \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --output-file bug-ai-prompt.json

      - name: Run Copilot bug triage (read-only)
        if: steps.ci_regression.outputs.should_route == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat bug-ai-prompt.json | copilot \
            -s \
            --no-ask-user \
            --disable-builtin-mcps \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --deny-tool='write' \
            --deny-tool='shell' \
            > bug-ai-review-raw.txt

      - name: Apply CI regression bug triage
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          python scripts/product/automation_cli.py bug-apply-ai-triage \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --ai-review-file bug-ai-review-raw.txt > bug-triage-result.json

      - name: Persist CI regression automation records
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/bugs product/generated product/implementation
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: record master ci regression run #${{ github.event.workflow_run.id }}"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

  ci-repair-loop:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Android CI' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Record CI result and bounded repair
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import json, os, subprocess, sys; from pathlib import Path; payload=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8')); wr=payload.get('workflow_run') or {}; prs=wr.get('pull_requests') or []; pr_number=(prs[0].get('number') if prs else None); print('No pull request linked to workflow run.') if pr_number is None else None; sys.exit(0) if pr_number is None else None; cmd=['python','scripts/product/automation_cli.py','record-ci-result','--pr-number',str(pr_number),'--workflow-name',str(wr.get('name','Android CI')),'--conclusion',str(wr.get('conclusion','unknown')),'--run-id',str(wr.get('id','unknown')),'--run-url',str(wr.get('html_url','')),'--repo-owner=${{ github.repository_owner }}','--repo-name=${{ github.event.repository.name }}','--github-token','${{ secrets.GITHUB_TOKEN }}','--output-file','ci-result.json']; subprocess.check_call(cmd)"

      - name: Persist automation records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/implementation product/generated product/bugs
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: ci repair loop run #${{ github.event.workflow_run.id }}"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

