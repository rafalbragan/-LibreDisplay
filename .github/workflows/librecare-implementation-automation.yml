name: LibreCare Implementation Automation

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
  workflow_dispatch:
    inputs:
      bug_id:
        description: "Canonical confirmed bug id to resume"
        required: true
        type: string
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: product-foundation-state
  cancel-in-progress: false

jobs:
  bug-intake-triage:
    if: >-
      github.event_name == 'issues' &&
      (
        (
          startsWith(github.event.issue.title, '[Blad LibreCare]') ||
          startsWith(github.event.issue.title, '[Błąd LibreCare]')
        ) &&
        contains(github.event.issue.body, '### Co się stało?') &&
        contains(github.event.issue.body, '### Jakiego zachowania oczekiwałeś?') &&
        contains(github.event.issue.body, '### Jak odtworzyć problem?') &&
        contains(github.event.issue.body, '### Gdzie występuje?') &&
        contains(github.event.issue.body, '### Czy problem występował wcześniej?')
      )
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Import bug record
        run: |
          python scripts/product/automation_cli.py bug-import --event-file "$GITHUB_EVENT_PATH"

      - name: Detect bug id
        id: bug
        run: |
          python -c "import json; from pathlib import Path; issue_number=int('${{ github.event.issue.number }}'); bug_id=next((data.get('bug_id','') for p in sorted((Path('product')/'bugs').glob('BUG-*.json')) for data in [json.loads(p.read_text(encoding='utf-8'))] if data.get('source_issue_number')==issue_number), ''); Path('bug-id.txt').write_text(bug_id, encoding='utf-8')"
          echo "bug_id=$(cat bug-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Build triage prompt
        run: |
          python scripts/product/automation_cli.py bug-build-ai-prompt \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --output-file bug-ai-prompt.json

      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot@latest

      - name: Copilot CLI smoke check
        run: |
          copilot --version
          copilot --help >/dev/null

      - name: Run Copilot bug triage (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat bug-ai-prompt.json | copilot \
            -s \
            --no-ask-user \
            --disable-builtin-mcps \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --deny-tool='write' \
            --deny-tool='shell' \
            > bug-ai-review-raw.txt

      - name: Apply bug AI triage with deterministic governance
        run: |
          python scripts/product/automation_cli.py bug-apply-ai-triage \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --ai-review-file bug-ai-review-raw.txt > bug-triage-result.json

      - name: Determine if auto-fix is allowed
        id: triage
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('bug-triage-result.json').read_text(encoding='utf-8'))
          classification = str(data.get('classification') or 'INCONCLUSIVE')
          allowed = classification == 'CONFIRMED_DEFECT'
          output = Path(os.environ['GITHUB_OUTPUT'])
          output.write_text("\n".join([
              f"allowed={'true' if allowed else 'false'}",
              f"classification={classification}",
          ]) + "\n", encoding='utf-8')
          print(f"classification={classification}")
          print(f"allowed={str(allowed).lower()}")
          PY

      - name: Report Product decision bridge
        if: steps.triage.outputs.classification == 'NEEDS_PRODUCT_DECISION'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('product/generated/bug-product-decisions') / f"{Path('bug-id.txt').read_text(encoding='utf-8').strip()}.json"
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          print('BUG_PRODUCT_DECISION_BRIDGE:')
          print(f"BUG_ID: {data.get('bug_id', '')}")
          print(f"CLASSIFICATION: {data.get('classification', '')}")
          print(f"STATUS: {data.get('status', '')}")
          PY

      - name: Report inconclusive bug stop
        if: steps.triage.outputs.classification == 'INCONCLUSIVE'
        run: echo "Bug triage remained inconclusive; no Product Inbox decision bridge and no auto-fix handoff were created."

      - name: Attempt bug fix handoff for confirmed defects
        if: steps.triage.outputs.allowed == 'true'
        id: bug_handoff
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          python scripts/product/automation_cli.py bug-sync-fix-handoff \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --repo-owner="${{ github.repository_owner }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --github-token "$GITHUB_TOKEN" \
            --copilot-assignment-token "$COPILOT_AGENT_USER_TOKEN" \
            --base-branch master \
            --output-file bug-handoff.json

      - name: Report bug fix handoff result
        if: steps.triage.outputs.allowed == 'true'
        id: bug_handoff_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('bug-handoff.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          result = str(data.get('handoff_result') or 'HANDOFF_FAILED')
          issue_number = str(data.get('implementation_issue_number') or '')
          issue_url = str(data.get('implementation_issue_url') or '')
          assigned = str(bool(data.get('copilot_real_assignee_confirmed'))).lower()
          label_status = data.get('bugfix_label_result') or 'UNKNOWN'
          failure_reason = str(data.get('failure_reason') or data.get('assignment_error') or '')[:280]

          print('FIX_HANDOFF_RESULT:')
          print(f"HANDOFF_RESULT: {result}")
          print(f"FIX_ISSUE_NUMBER: {issue_number}")
          print(f"FIX_ISSUE_URL: {issue_url}")
          print(f"COPILOT_AGENT_ASSIGNED: {assigned}")
          print(f"COPILOT_ASSIGNMENT_VERIFIED_ON_GITHUB: {assigned}")
          print(f"BUGFIX_LABEL_CREATED_OR_REUSED: {label_status in {'CREATED', 'REUSED'}}")
          if failure_reason:
              print(f"HANDOFF_FAILURE_REASON: {failure_reason}")

          output = Path(os.environ['GITHUB_OUTPUT'])
          output.write_text("\n".join([
              f"handoff_result={result}",
              f"issue_number={issue_number}",
              f"issue_url={issue_url}",
              f"copilot_assigned={assigned}",
              f"label_status={label_status}",
              f"failure_reason={failure_reason}",
          ]) + "\n", encoding='utf-8')
          PY

      - name: Persist automation records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/product/automation_cli.py persist-bug-records \
            --branch "${{ github.ref_name }}" \
            --commit-message "product: bug intake #${{ github.event.issue.number }}" \
            --validate-product \
            --output-file bug-persist.json

      - name: Fail workflow if confirmed-defect handoff failed
        if: steps.triage.outputs.allowed == 'true' && steps.bug_handoff_summary.outputs.handoff_result == 'HANDOFF_FAILED'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('bug-handoff.json').read_text(encoding='utf-8')) if Path('bug-handoff.json').exists() else {}
          reason = str(data.get('failure_reason') or data.get('assignment_error') or 'Handoff failed.')[:280]
          print(f'HANDOFF_FAILED: {reason}')
          raise SystemExit(1)
          PY

  resume-confirmed-bug-handoff:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate requested bug can resume
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          bug_id = "${{ inputs.bug_id }}".strip()
          path = Path('product') / 'bugs' / f'{bug_id}.json'
          if not path.exists():
              raise SystemExit(f'ERROR: canonical bug {bug_id} does not exist')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if str(payload.get('classification') or '') != 'CONFIRMED_DEFECT':
              raise SystemExit(f'ERROR: bug {bug_id} is not classified as CONFIRMED_DEFECT')
          if str(payload.get('status') or '') not in {'CONFIRMED_DEFECT', 'QUEUED', 'IN_PROGRESS', 'REPAIRING', 'PR_READY'}:
              raise SystemExit(f"ERROR: bug {bug_id} is not resumable from status {payload.get('status')}")
          print(f'BUG_RESUME_OK: {bug_id}')
          PY

      - name: Attempt manual bug fix handoff resume
        id: bug_handoff
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          python scripts/product/automation_cli.py bug-sync-fix-handoff \
            --bug-id "${{ inputs.bug_id }}" \
            --repo-owner="${{ github.repository_owner }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --github-token "$GITHUB_TOKEN" \
            --copilot-assignment-token "$COPILOT_AGENT_USER_TOKEN" \
            --base-branch master \
            --output-file bug-handoff.json

      - name: Report bug fix handoff result
        id: bug_handoff_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('bug-handoff.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          result = str(data.get('handoff_result') or 'HANDOFF_FAILED')
          issue_number = str(data.get('implementation_issue_number') or '')
          issue_url = str(data.get('implementation_issue_url') or '')
          assigned = str(bool(data.get('copilot_real_assignee_confirmed'))).lower()
          failure_reason = str(data.get('failure_reason') or data.get('assignment_error') or '')[:280]

          print('FIX_HANDOFF_RESULT:')
          print(f"HANDOFF_RESULT: {result}")
          print(f"FIX_ISSUE_NUMBER: {issue_number}")
          print(f"FIX_ISSUE_URL: {issue_url}")
          print(f"COPILOT_AGENT_ASSIGNED: {assigned}")
          print(f"COPILOT_ASSIGNMENT_VERIFIED_ON_GITHUB: {assigned}")
          if failure_reason:
              print(f"HANDOFF_FAILURE_REASON: {failure_reason}")

          output = Path(os.environ['GITHUB_OUTPUT'])
          output.write_text("\n".join([
              f"handoff_result={result}",
              f"issue_number={issue_number}",
              f"issue_url={issue_url}",
              f"copilot_assigned={assigned}",
              f"failure_reason={failure_reason}",
          ]) + "\n", encoding='utf-8')
          PY

      - name: Persist resumed bug records
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/product/automation_cli.py persist-bug-records \
            --branch master \
            --commit-message "product: resume bug handoff ${{ inputs.bug_id }}" \
            --validate-product \
            --output-file bug-persist.json

      - name: Fail workflow if manual bug handoff failed
        if: steps.bug_handoff_summary.outputs.handoff_result == 'HANDOFF_FAILED'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('bug-handoff.json').read_text(encoding='utf-8')) if Path('bug-handoff.json').exists() else {}
          reason = str(data.get('failure_reason') or data.get('assignment_error') or 'Manual bug handoff failed.')[:280]
          print(f'HANDOFF_FAILED: {reason}')
          raise SystemExit(1)
          PY

  track-work-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Track requirement/bug PR
        run: |
          python scripts/product/automation_cli.py track-work-pr \
            --event-file "$GITHUB_EVENT_PATH" \
            --output-file pr-track.json

      - name: Persist automation records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/bugs product/implementation product/generated product/requirements
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: track automation pr #${{ github.event.pull_request.number }}"
            git pull --rebase origin "${{ github.event.pull_request.base.ref }}"
            git push origin "HEAD:${{ github.event.pull_request.base.ref }}"
          fi

  master-ci-regression-intake:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      copilot-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Collect master CI regression metadata
        id: ci_regression
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wr = context.payload.workflow_run || {};
            const workflowName = String(wr.name || '');
            const conclusion = String(wr.conclusion || '').toLowerCase();
            const branch = String(wr.head_branch || '');
            const triggeringEvent = String(wr.event || '').toLowerCase();
            const recognized = new Set(['Android CI', 'Android APK Build']);
            const deterministicSignals = {
              'Android CI': ['Fast test suite', 'Run fast suite', 'Verify build environment'],
              'Android APK Build': ['Build debug APK', 'Build release APK', 'Fail if debug APK was not created'],
            };
            const jobs = recognized.has(workflowName)
              ? await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: Number(wr.id),
                  per_page: 100,
                })
              : [];
            const failedJobs = jobs.filter(job => String(job.conclusion || '').toLowerCase() === 'failure');
            let failedStep = '';
            for (const job of failedJobs) {
              const step = (job.steps || []).find(s => String(s.conclusion || '').toLowerCase() === 'failure');
              if (step) {
                failedStep = `${job.name}: ${step.name}`;
                break;
              }
            }
            const signalList = deterministicSignals[workflowName] || [];
            const deterministicWorkExecuted = jobs.some(job => {
              const haystack = [job.name, ...(job.steps || []).map(step => step.name)].join('\n');
              return signalList.some(signal => haystack.includes(signal));
            });
            const meta = {
              workflow_name: workflowName,
              conclusion,
              event: triggeringEvent,
              branch,
              run_id: String(wr.id || ''),
              run_url: String(wr.html_url || ''),
              head_sha: String(wr.head_sha || ''),
              failed_job: failedJobs[0] ? String(failedJobs[0].name || '') : '',
              failed_step: failedStep,
              log_excerpt: failedStep || (failedJobs[0] ? String(failedJobs[0].name || '') : ''),
              deterministic_work_executed: deterministicWorkExecuted,
            };
            fs.writeFileSync('ci-regression-context.json', JSON.stringify(meta));
            const shouldRoute = recognized.has(workflowName)
              && conclusion === 'failure'
              && ['master', 'main'].includes(branch)
              && triggeringEvent !== 'pull_request'
              && deterministicWorkExecuted;
            core.setOutput('should_route', shouldRoute ? 'true' : 'false');

      - name: Create canonical CI regression bug evidence
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          python scripts/product/automation_cli.py ci-regression-intake \
            --event-file "$GITHUB_EVENT_PATH" \
            --metadata-file ci-regression-context.json \
            --output-file ci-regression-result.json

      - name: Detect CI regression bug id
        if: steps.ci_regression.outputs.should_route == 'true'
        id: bug
        run: |
          python -c "import json; from pathlib import Path; data=json.loads(Path('ci-regression-result.json').read_text(encoding='utf-8')); Path('ci-regression-bug-id.txt').write_text(str(data.get('bug_id','')), encoding='utf-8')"
          echo "bug_id=$(cat ci-regression-bug-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Enrich CI regression bug evidence from workflow logs and artifacts
        id: ci_regression_evidence
        if: steps.ci_regression.outputs.should_route == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/product/automation_cli.py ci-regression-enrich-evidence \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --repo-owner="${{ github.repository_owner }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --github-token "$GITHUB_TOKEN" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --output-file ci-regression-evidence.json

      - name: Report CI evidence enrichment summary
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('ci-regression-evidence.json').read_text(encoding='utf-8'))
          print('CI_EVIDENCE_RESULT:')
          print(f"BUG_ID: {data.get('bug_id', '')}")
          print(f"RUN_ID: {data.get('run_id', '')}")
          print(f"GITHUB_TOKEN_PRESENT: {data.get('github_token_present')}")
          print(f"JOB_LOGS_FETCHED: {data.get('job_logs_fetched')}")
          print(f"ARTIFACTS_FOUND: {data.get('artifacts_found')}")
          print(f"ARTIFACT_NAMES: {', '.join(data.get('artifact_names') or []) or 'BRAK'}")
          print(f"GRADLE_LOG_FOUND: {bool(data.get('useful_diagnostic_found'))}")
          print(f"DIAGNOSTIC_LINES_FOUND: {data.get('diagnostic_lines_found')}")
          print(f"RESULT: {data.get('result')}")
          if data.get('result') == 'RETRIEVAL_FAILED':
              print(f"JOB_LOG_HTTP_STATUS: {data.get('job_log_http_status', 'UNKNOWN')}")
              print(f"ARTIFACT_DOWNLOAD_STATUS: {data.get('artifact_download_status', 'UNKNOWN')}")
              print(f"ARTIFACT_EXTRACT_STATUS: {data.get('artifact_extract_status', 'UNKNOWN')}")
              print(f"TEXT_FILES_SCANNED: {data.get('text_files_scanned', 0)}")
              print(f"CANDIDATE_FILES_FOUND: {data.get('candidate_files_found', 0)}")
              error = str(data.get('safe_diagnostic') or data.get('error') or 'Nie udało się pobrać dowodów z GitHub Actions.')
              print(f"SAFE_DIAGNOSTIC: {error[:280]}")
          PY

      - name: Install GitHub Copilot CLI
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          npm install -g @github/copilot@latest

      - name: Copilot CLI smoke check
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          copilot --version
          copilot --help >/dev/null

      - name: Build triage prompt for CI regression bug
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          python scripts/product/automation_cli.py bug-build-ai-prompt \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --output-file bug-ai-prompt.json

      - name: Verify enriched evidence reached the triage prompt
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('ci-regression-evidence.json').read_text(encoding='utf-8'))
          if evidence.get('result') != 'ENRICHED':
              print('Prompt verification skipped because no enriched evidence was retrieved.')
              raise SystemExit(0)
          prompt = json.loads(Path('bug-ai-prompt.json').read_text(encoding='utf-8'))
          if str(prompt.get('ci_failure_evidence_excerpt') or '').strip() != str(evidence.get('diagnostic_excerpt') or '').strip():
              raise SystemExit('Enriched compiler evidence was not propagated into bug-ai-prompt.json')
          print('Prompt verification passed.')
          PY

      - name: Run Copilot bug triage (read-only)
        if: steps.ci_regression.outputs.should_route == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat bug-ai-prompt.json | copilot \
            -s \
            --no-ask-user \
            --disable-builtin-mcps \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --deny-tool='write' \
            --deny-tool='shell' \
            > bug-ai-review-raw.txt

      - name: Apply CI regression bug triage
        if: steps.ci_regression.outputs.should_route == 'true'
        run: |
          python scripts/product/automation_cli.py bug-apply-ai-triage \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --ai-review-file bug-ai-review-raw.txt > bug-triage-result.json

      - name: Determine if CI regression auto-fix is allowed
        if: steps.ci_regression.outputs.should_route == 'true'
        id: ci_triage
        run: |
          python -c "import json; from pathlib import Path; data=json.loads(Path('bug-triage-result.json').read_text(encoding='utf-8')); allowed=(data.get('classification')=='CONFIRMED_DEFECT'); Path('ci-triage-allowed.txt').write_text('true' if allowed else 'false', encoding='utf-8'); print(f'allowed={str(allowed).lower()}')"
          echo "allowed=$(cat ci-triage-allowed.txt)" >> "$GITHUB_OUTPUT"

      - name: Attempt bug fix handoff for confirmed CI regressions
        if: steps.ci_regression.outputs.should_route == 'true' && steps.ci_triage.outputs.allowed == 'true'
        id: bug_handoff
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          python scripts/product/automation_cli.py bug-sync-fix-handoff \
            --bug-id "${{ steps.bug.outputs.bug_id }}" \
            --repo-owner="${{ github.repository_owner }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --github-token "$GITHUB_TOKEN" \
            --copilot-assignment-token "$COPILOT_AGENT_USER_TOKEN" \
            --base-branch master \
            --output-file bug-handoff.json

      - name: Report bug fix handoff result
        if: steps.ci_regression.outputs.should_route == 'true' && steps.ci_triage.outputs.allowed == 'true'
        id: bug_handoff_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('bug-handoff.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          result = str(data.get('handoff_result') or 'HANDOFF_FAILED')
          issue_number = str(data.get('implementation_issue_number') or '')
          issue_url = str(data.get('implementation_issue_url') or '')
          assigned = str(bool(data.get('copilot_real_assignee_confirmed'))).lower()
          label_status = data.get('bugfix_label_result') or 'UNKNOWN'
          failure_reason = str(data.get('failure_reason') or data.get('assignment_error') or '')[:280]

          print('FIX_HANDOFF_RESULT:')
          print(f"HANDOFF_RESULT: {result}")
          print(f"FIX_ISSUE_NUMBER: {issue_number}")
          print(f"FIX_ISSUE_URL: {issue_url}")
          print(f"COPILOT_AGENT_ASSIGNED: {assigned}")
          print(f"COPILOT_ASSIGNMENT_VERIFIED_ON_GITHUB: {assigned}")
          print(f"BUGFIX_LABEL_CREATED_OR_REUSED: {label_status in {'CREATED', 'REUSED'}}")
          if failure_reason:
              print(f"HANDOFF_FAILURE_REASON: {failure_reason}")

          output = Path(os.environ['GITHUB_OUTPUT'])
          output.write_text("\n".join([
              f"handoff_result={result}",
              f"issue_number={issue_number}",
              f"issue_url={issue_url}",
              f"copilot_assigned={assigned}",
              f"label_status={label_status}",
              f"failure_reason={failure_reason}",
          ]) + "\n", encoding='utf-8')
          PY

      - name: Persist CI regression automation records
        if: always() && steps.ci_regression.outputs.should_route == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/product/automation_cli.py persist-bug-records \
            --branch master \
            --commit-message "product: record master ci regression run #${{ github.event.workflow_run.id }}" \
            --validate-product \
            --output-file bug-persist.json

      - name: Fail workflow if confirmed-defect handoff failed
        if: steps.ci_regression.outputs.should_route == 'true' && steps.ci_triage.outputs.allowed == 'true' && steps.bug_handoff_summary.outputs.handoff_result == 'HANDOFF_FAILED'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('bug-handoff.json').read_text(encoding='utf-8')) if Path('bug-handoff.json').exists() else {}
          reason = str(data.get('failure_reason') or data.get('assignment_error') or 'Handoff failed.')[:280]
          print(f'HANDOFF_FAILED: {reason}')
          raise SystemExit(1)
          PY

  ci-repair-loop:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Android CI' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Record CI result and bounded repair
        id: ci_result
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          python -c "import json, os, subprocess, sys; from pathlib import Path; payload=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8')); wr=payload.get('workflow_run') or {}; prs=wr.get('pull_requests') or []; pr_number=(prs[0].get('number') if prs else None); print('No pull request linked to workflow run.') if pr_number is None else None; sys.exit(0) if pr_number is None else None; cmd=['python','scripts/product/automation_cli.py','record-ci-result','--pr-number',str(pr_number),'--workflow-name',str(wr.get('name','Android CI')),'--conclusion',str(wr.get('conclusion','unknown')),'--run-id',str(wr.get('id','unknown')),'--run-url',str(wr.get('html_url','')),'--repo-owner=${{ github.repository_owner }}','--repo-name=${{ github.event.repository.name }}','--github-token','${{ secrets.GITHUB_TOKEN }}','--copilot-assignment-token','${{ secrets.COPILOT_AGENT_USER_TOKEN }}','--output-file','ci-result.json']; subprocess.check_call(cmd)"

      - name: Report CI repair handoff result
        id: ci_result_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('ci-result.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          failure_reason = str(data.get('failure_reason') or '')[:280]
          failed = bool(failure_reason and data.get('status') == 'REPAIRING' and not data.get('repair_assignment_verified'))
          print('CI_REPAIR_RESULT:')
          print(f"STATUS: {data.get('status', '')}")
          print(f"REPAIR_ATTEMPTED: {str(bool(data.get('repair_attempted'))).lower()}")
          print(f"REPAIR_ASSIGNMENT_VERIFIED: {str(bool(data.get('repair_assignment_verified'))).lower()}")
          if failure_reason:
              print(f"REPAIR_FAILURE_REASON: {failure_reason}")

          output = Path(os.environ['GITHUB_OUTPUT'])
          output.write_text("\n".join([
              f"repair_handoff_failed={'true' if failed else 'false'}",
              f"failure_reason={failure_reason}",
          ]) + "\n", encoding='utf-8')
          PY

      - name: Persist automation records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/implementation product/generated product/bugs
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: ci repair loop run #${{ github.event.workflow_run.id }}"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Fail workflow if CI repair handoff failed
        if: steps.ci_result_summary.outputs.repair_handoff_failed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('ci-result.json').read_text(encoding='utf-8')) if Path('ci-result.json').exists() else {}
          reason = str(data.get('failure_reason') or 'CI repair handoff failed.')[:280]
          print(f'CI_REPAIR_HANDOFF_FAILED: {reason}')
          raise SystemExit(1)
          PY

