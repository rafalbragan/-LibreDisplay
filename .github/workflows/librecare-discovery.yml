name: LibreCare Discovery

on:
  workflow_dispatch:
    inputs:
      publish_top3:
        description: "Publish max TOP 3 candidates to Product Inbox"
        required: false
        type: boolean
        default: false
      languages:
        description: "Comma-separated languages (pl,en,de,fr,es)"
        required: false
        type: string
        default: "pl,en,de,fr,es"
      primary_languages:
        description: "Primary full-budget languages"
        required: false
        type: string
        default: "pl,en"
      lookback_days:
        description: "Evidence lookback in days (1..1825)"
        required: false
        type: number
        default: 365
      max_items_per_source:
        description: "Max accepted items per source (1..30)"
        required: false
        type: number
        default: 30

concurrency:
  group: product-foundation-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      copilot-requests: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @github/copilot@latest

      - name: Copilot CLI smoke check
        run: |
          copilot --version
          copilot --help >/dev/null

      - name: Run Discovery Agent
        id: discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python scripts/product/discovery_cli.py \
            --sources-file product/discovery/sources.json \
            --query-packs-file product/discovery/query-packs.json \
            --languages "${{ inputs.languages }}" \
            --primary-languages "${{ inputs.primary_languages }}" \
            --lookback-days "${{ inputs.lookback_days }}" \
            --max-items-per-source "${{ inputs.max_items_per_source }}" \
            --ai-mode copilot \
            --ai-model gpt-5.4-mini \
            --repo-owner "${{ github.repository_owner }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --github-token "$GITHUB_TOKEN" \
            ${{ inputs.publish_top3 && '--publish-top3' || '' }}

      - name: Validate Product Foundation
        if: always()
        run: |
          python scripts/product/product_cli.py validate
          python scripts/product/product_cli.py summary

      - name: Upload discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librecare-discovery-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            product/generated/discovery/
            product/research/observations/OBS-*.json
