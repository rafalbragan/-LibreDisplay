name: Product Quality

# Runs ONLY when product infrastructure files change. It does not touch Android CI or the
# Firebase Test Lab workflow.

on:
  push:
    paths:
      - "product/**"
      - "scripts/product/**"
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths:
      - "product/**"
      - "scripts/product/**"
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-validate:
    name: Validate product records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Product CLI dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: |
          # Compatibility exception: GitHub Actions supports "copilot-requests" before current actionlint permission metadata does.
          ./actionlint -ignore 'unknown permission scope .*copilot-requests.*'

      - name: Run Product CLI self-tests
        run: python -m unittest discover -s scripts/product/tests -p "test_*.py"

      - name: Validate product records
        run: python scripts/product/product_cli.py validate

      - name: Product summary
        run: python scripts/product/product_cli.py summary

