name: API 36 single-device home history gesture

# GitHub-hosted emulator boot has been unreliable on API 36.
# Keep this expensive diagnostic manual; IntelliJ/Firebase are the primary device gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gesture-api36:
    name: Home chart gesture on one API 36 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run only dashboard gesture instrumentation on Android 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1"
            adb shell service check package | grep -q "found"
            chmod +x gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.libredisplay.delivery.DeliveryInstrumentedTest#glucoseChartSeparatesPointTapHorizontalPanAndDashboardScroll'
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api36-home-gesture-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 7
