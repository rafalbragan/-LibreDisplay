name: LibreCare Product Inbox

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: product-inbox-state
  cancel-in-progress: false

jobs:
  inbox-review:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Product Inbox label and routing
        id: route
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const hasLabel = (issue.labels || []).some(l => l.name === 'product-inbox');
            const title = issue.title || '';
            const hasPrefix = title.startsWith('[Product Inbox]');
            const body = issue.body || '';
            const normalizedBody = body.replace(/\r\n/g, '\n').toLowerCase();
            const requiredHeadings = [
              '### type',
              '### persona',
              '### what did you notice / what would you like?',
            ];
            const hasFormSignature = requiredHeadings.every(h => normalizedBody.includes(h));
            const shouldProcess = hasLabel || hasPrefix || hasFormSignature;

            if (!shouldProcess) {
              core.setOutput('process', 'false');
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'product-inbox',
              });
            } catch (_err) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'product-inbox',
                color: '1f6feb',
                description: 'LibreCare Product Inbox submissions',
              });
            }

            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['product-inbox'],
              });
            }

            core.setOutput('process', 'true');

      - name: Setup Python
        if: steps.route.outputs.process == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        if: steps.route.outputs.process == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.route.outputs.process == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Save GitHub event payload
        if: steps.route.outputs.process == 'true'
        run: |
          cat "$GITHUB_EVENT_PATH" > github-event.json

      - name: Import inbox issue
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-import --event-file github-event.json

      - name: Validate Product Foundation
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py validate

      - name: Build AI review prompt
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-build-ai-prompt \
            --issue-number "${{ github.event.issue.number }}" \
            --output-file inbox-ai-prompt.md

      - name: Install GitHub Copilot CLI
        if: steps.route.outputs.process == 'true'
        run: |
          npm install -g @github/copilot

      - name: Copilot CLI smoke check
        if: steps.route.outputs.process == 'true'
        run: |
          copilot --version
          copilot --help >/dev/null

      - name: Run Copilot AI review (read-only)
        if: steps.route.outputs.process == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          copilot \
            -s \
            --no-ask-user \
            --disable-builtin-mcps \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --deny-tool='write' \
            --deny-tool='shell' \
            < inbox-ai-prompt.md \
            > inbox-ai-review-raw.txt

      - name: Validate AI JSON and apply governance overrides
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-apply-ai-review \
            --issue-number "${{ github.event.issue.number }}" \
            --ai-review-file inbox-ai-review-raw.txt

      - name: Product validation
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py validate

      - name: Product review
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py review

      - name: Persist Product Foundation state
        if: steps.route.outputs.process == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/inbox product/generated product/review product/research
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: process inbox issue #${{ github.event.issue.number }}"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Build issue review comment
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-issue-review \
            --issue-number "${{ github.event.issue.number }}" \
            --output-file product-review-comment.md

      - name: Upsert review comment
        if: steps.route.outputs.process == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- LIBRECARE_PRODUCT_REVIEW -->';
            const body = fs.readFileSync('product-review-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  inbox-decision:
    if: github.event_name == 'issue_comment' && contains(join(github.event.issue.labels.*.name, ','), 'product-inbox')
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Save GitHub event payload
        run: |
          cat "$GITHUB_EVENT_PATH" > github-event.json

      - name: Apply human decision command
        run: |
          python scripts/product/product_cli.py inbox-handle-decision \
            --event-file github-event.json \
            --repo-owner "${{ github.repository_owner }}" | tee decision-output.txt

      - name: Product validation
        run: |
          python scripts/product/product_cli.py validate

      - name: Product review
        run: |
          python scripts/product/product_cli.py review

      - name: Persist Product Foundation state
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/inbox product/generated product/review product/research
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: apply inbox decision issue #${{ github.event.issue.number }}"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Upsert decision result comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- LIBRECARE_PRODUCT_DECISION -->';
            const output = fs.existsSync('decision-output.txt')
              ? fs.readFileSync('decision-output.txt', 'utf8').trim()
              : 'No decision output produced.';
            const body = `${marker}\n## LibreCare Product Decision\n\n${output}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

