name: LibreCare Product Inbox

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]

concurrency:
  group: product-foundation-state
  cancel-in-progress: false

jobs:
  inbox-review:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Product Inbox label and routing
        id: route
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const hasLabel = (issue.labels || []).some(l => l.name === 'product-inbox');
            const title = issue.title || '';
            const hasPrefix = title.startsWith('[Product Inbox]') || title.startsWith('[Skrzynka Produktowa]');
            const body = issue.body || '';
            const normalizedBody = body.replace(/\r\n/g, '\n').toLowerCase();
            const requiredHeadings = [
              '### typ zgłoszenia',
              '### persona użytkownika',
              '### co zauważyłeś(-aś) / czego potrzebujesz?',
            ];
            const hasFormSignature = requiredHeadings.every(h => normalizedBody.includes(h));
            const shouldProcess = hasLabel || hasPrefix || hasFormSignature;

            if (!shouldProcess) {
              core.setOutput('process', 'false');
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'product-inbox',
              });
            } catch (_err) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'product-inbox',
                color: '1f6feb',
                description: 'Zgłoszenia do skrzynki produktu LibreCare',
              });
            }

            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['product-inbox'],
              });
            }

            core.setOutput('process', 'true');

      - name: Setup Python
        if: steps.route.outputs.process == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        if: steps.route.outputs.process == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.route.outputs.process == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Save GitHub event payload
        if: steps.route.outputs.process == 'true'
        run: |
          cat "$GITHUB_EVENT_PATH" > github-event.json

      - name: Import inbox issue
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-import --event-file github-event.json

      - name: Validate Product Foundation
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py validate

      - name: Build AI review prompt
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-build-ai-prompt \
            --issue-number "${{ github.event.issue.number }}" \
            --output-file inbox-ai-prompt.md

      - name: Install GitHub Copilot CLI
        if: steps.route.outputs.process == 'true'
        run: |
          npm install -g @github/copilot

      - name: Copilot CLI smoke check
        if: steps.route.outputs.process == 'true'
        run: |
          copilot --version
          copilot --help >/dev/null

      - name: Run Copilot AI review (read-only)
        if: steps.route.outputs.process == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          copilot \
            -s \
            --no-ask-user \
            --disable-builtin-mcps \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --deny-tool='write' \
            --deny-tool='shell' \
            < inbox-ai-prompt.md \
            > inbox-ai-review-raw.txt

      - name: Validate AI JSON and apply governance overrides
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-apply-ai-review \
            --issue-number "${{ github.event.issue.number }}" \
            --ai-review-file inbox-ai-review-raw.txt

      - name: Product validation
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py validate

      - name: Product review
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py review

      - name: Persist Product Foundation state
        if: steps.route.outputs.process == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/inbox product/generated product/review product/research product/requirements product/decisions product/implementation
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: process inbox issue #${{ github.event.issue.number }}"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Build issue review comment
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-issue-review \
            --issue-number "${{ github.event.issue.number }}" \
            --output-file product-review-comment.md

      - name: Upsert review comment
        if: steps.route.outputs.process == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- LIBRECARE_PRODUCT_REVIEW -->';
            const body = fs.readFileSync('product-review-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  inbox-decision:
    if: github.event_name == 'issue_comment' && contains(join(github.event.issue.labels.*.name, ','), 'product-inbox')
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Save GitHub event payload
        run: |
          cat "$GITHUB_EVENT_PATH" > github-event.json

      - name: Apply human decision command
        run: |
          python scripts/product/product_cli.py inbox-handle-decision \
            --event-file github-event.json \
            --repo-owner "${{ github.repository_owner }}" | tee decision-output.txt

      - name: Sync implementation handoff after /accept
        if: github.event.comment.body == '/accept'
        env:
          COPILOT_AGENT_LOGIN: copilot-swe-agent[bot]
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Product CLI uses the supported Copilot issue-assignment payload shape
          # (`agent_assignment`, with `agentAssignment` fallback only for compatibility)
          python scripts/product/product_cli.py inbox-sync-implementation-handoff \
            --event-file github-event.json \
            --repo-owner="${{ github.repository_owner }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --github-token "$GITHUB_TOKEN" \
            --base-branch master \
            --output-file handoff-result.json

      - name: Upsert handoff assignment status comment
        if: github.event.comment.body == '/accept'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('handoff-result.json')) {
              core.info('No handoff payload generated.');
              return;
            }
            const payload = JSON.parse(fs.readFileSync('handoff-result.json', 'utf8'));
            if (!payload.comment_markdown) {
              core.info('No handoff comment required.');
              return;
            }
            const marker = '<!-- LIBRECARE_COPILOT_ASSIGNMENT_STATUS -->';
            const body = payload.comment_markdown;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Product validation
        run: |
          python scripts/product/product_cli.py validate

      - name: Product review
        run: |
          python scripts/product/product_cli.py review

      - name: Persist Product Foundation state
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/inbox product/generated product/review product/research product/requirements product/decisions product/implementation
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: apply inbox decision issue #${{ github.event.issue.number }}"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Upsert decision result comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- LIBRECARE_PRODUCT_DECISION -->';
            const output = fs.existsSync('decision-output.txt')
              ? fs.readFileSync('decision-output.txt', 'utf8').trim()
              : 'Brak wyniku komendy decyzyjnej.';
            const body = `${marker}\n${output}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  implementation-pr-tracking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Save GitHub event payload
        run: |
          cat "$GITHUB_EVENT_PATH" > github-event.json

      - name: Track implementation pull request
        run: |
          python scripts/product/product_cli.py track-implementation-pr \
            --event-file github-event.json \
            --output-file pr-track.json || true

      - name: Validate Product Foundation
        run: |
          python scripts/product/product_cli.py validate
          python scripts/product/product_cli.py summary

      - name: Persist Product Foundation state
        env:
          BRANCH_NAME: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/inbox product/generated product/review product/research product/requirements product/decisions product/implementation
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: track implementation pr #${{ github.event.pull_request.number }}"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Upsert implementation status comment on originating inbox issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-track.json')) {
              core.info('No PR tracking payload created.');
              return;
            }
            const payload = JSON.parse(fs.readFileSync('pr-track.json', 'utf8'));
            if (!payload.originating_inbox_issue_number || !payload.comment_markdown) {
              core.info('No originating inbox issue linked.');
              return;
            }
            const marker = '<!-- LIBRECARE_IMPLEMENTATION_STATUS -->';
            const body = payload.comment_markdown;
            const { owner, repo } = context.repo;
            const issue_number = Number(payload.originating_inbox_issue_number);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  implementation-ci-repair-loop:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Android CI' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
      actions: read
    concurrency:
      group: product-implementation-ci-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Collect CI metadata
        id: ci_meta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wr = context.payload.workflow_run || {};
            const prs = wr.pull_requests || [];
            if (!prs.length) {
              core.setOutput('has_pr', 'false');
              return;
            }
            const prNumber = Number(prs[0].number);
            let failingStep = '';
            let failingTests = '';
            let failureOutput = '';
            if ((wr.conclusion || '').toLowerCase() !== 'success') {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(wr.id),
                per_page: 100,
              });
              const failedJobs = jobs.filter(j => (j.conclusion || '').toLowerCase() === 'failure');
              const failedSteps = [];
              for (const job of failedJobs) {
                for (const step of (job.steps || [])) {
                  if ((step.conclusion || '').toLowerCase() === 'failure') {
                    failedSteps.push(`${job.name}: ${step.name}`);
                  }
                }
              }
              failingStep = failedSteps[0] || (failedJobs[0] ? failedJobs[0].name : 'unknown');
              failingTests = failedSteps.slice(0, 3).join(' | ');
              failureOutput = failedJobs.slice(0, 2).map(j => `${j.name} (${j.html_url || ''})`).join(' | ');
            }
            const meta = {
              pr_number: prNumber,
              workflow_name: wr.name || 'Android CI',
              conclusion: wr.conclusion || 'unknown',
              run_id: String(wr.id || 'unknown'),
              run_url: wr.html_url || '',
              failing_step: failingStep,
              failing_tests: failingTests,
              log_excerpt: failureOutput,
            };
            fs.writeFileSync('ci-meta.json', JSON.stringify(meta));
            core.setOutput('has_pr', 'true');

      - name: Record CI result and bounded repair
        if: steps.ci_meta.outputs.has_pr == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import json, subprocess; from pathlib import Path; meta=json.loads(Path('ci-meta.json').read_text(encoding='utf-8')); cmd=['python','scripts/product/product_cli.py','record-ci-result','--pr-number',str(meta['pr_number']),'--workflow-name',str(meta.get('workflow_name','Android CI')),'--conclusion',str(meta.get('conclusion','unknown')),'--run-id',str(meta.get('run_id','unknown')),'--run-url',str(meta.get('run_url','')),'--failing-step',str(meta.get('failing_step','')),'--failing-tests',str(meta.get('failing_tests','')),'--log-excerpt',str(meta.get('log_excerpt','')),'--repo-owner=${{ github.repository_owner }}','--repo-name=${{ github.event.repository.name }}','--github-token','${{ secrets.GITHUB_TOKEN }}','--output-file','ci-result.json']; subprocess.check_call(cmd)"

      - name: Product validation
        if: steps.ci_meta.outputs.has_pr == 'true'
        run: |
          python scripts/product/product_cli.py validate

      - name: Persist Product Foundation state
        if: steps.ci_meta.outputs.has_pr == 'true'
        env:
          BRANCH_NAME: master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/implementation product/generated product/requirements product/inbox
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: record implementation ci result run #${{ github.event.workflow_run.id }}"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Upsert implementation CI status comment
        if: steps.ci_meta.outputs.has_pr == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ci-result.json')) {
              core.info('No CI result payload created.');
              return;
            }
            const payload = JSON.parse(fs.readFileSync('ci-result.json', 'utf8'));
            if (!payload.originating_inbox_issue_number || !payload.comment_markdown) {
              core.info('No inbox comment needed for this CI result.');
              return;
            }
            const marker = payload.status === 'FAILED'
              ? '<!-- LIBRECARE_IMPLEMENTATION_ATTENTION -->'
              : '<!-- LIBRECARE_IMPLEMENTATION_STATUS -->';
            const body = payload.comment_markdown;
            const { owner, repo } = context.repo;
            const issue_number = Number(payload.originating_inbox_issue_number);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upsert PR status comment
        if: steps.ci_meta.outputs.has_pr == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ci-meta.json')) {
              core.info('No CI metadata payload found.');
              return;
            }
            const meta = JSON.parse(fs.readFileSync('ci-meta.json', 'utf8'));
            const prNumber = Number(meta.pr_number || 0);
            if (!prNumber) {
              core.info('No PR number found in CI metadata.');
              return;
            }
            const marker = '<!-- LIBRECARE_IMPLEMENTATION_PR_NOTICE -->';
            const body = `${marker}\n## LibreCare — status Pull Request\n\nImplementacja przygotowana przez Copilot.\nWymaga zatwierdzenia człowieka przed scaleniem.`;
            const { owner, repo } = context.repo;
            const issue_number = prNumber;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

