name: LibreCare Product Inbox

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: product-foundation-state
  cancel-in-progress: false

jobs:
  inbox-review:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: write
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Product Inbox label and routing
        id: route
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const hasLabel = (issue.labels || []).some(l => l.name === 'product-inbox');
            const title = issue.title || '';
            const hasPrefix = title.startsWith('[Product Inbox]') || title.startsWith('[Skrzynka Produktowa]');
            const body = issue.body || '';
            const normalizedBody = body.replace(/\r\n/g, '\n').toLowerCase();
            const requiredHeadings = [
              '### typ zgłoszenia',
              '### persona użytkownika',
              '### co zauważyłeś(-aś) / czego potrzebujesz?',
            ];
            const hasFormSignature = requiredHeadings.every(h => normalizedBody.includes(h));
            const shouldProcess = hasLabel || hasPrefix || hasFormSignature;

            if (!shouldProcess) {
              core.setOutput('process', 'false');
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'product-inbox',
              });
            } catch (_err) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'product-inbox',
                color: '1f6feb',
                description: 'Zgłoszenia do skrzynki produktu LibreCare',
              });
            }

            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['product-inbox'],
              });
            }

            core.setOutput('process', 'true');

      - name: Setup Python
        if: steps.route.outputs.process == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        if: steps.route.outputs.process == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.route.outputs.process == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Save GitHub event payload
        if: steps.route.outputs.process == 'true'
        run: |
          cat "$GITHUB_EVENT_PATH" > github-event.json

      - name: Import inbox issue
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-import --event-file github-event.json

      - name: Validate Product Foundation
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py validate

      - name: Build AI review prompt
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-build-ai-prompt \
            --issue-number "${{ github.event.issue.number }}" \
            --output-file inbox-ai-prompt.md

      - name: Install GitHub Copilot CLI
        if: steps.route.outputs.process == 'true'
        run: |
          npm install -g @github/copilot@latest

      - name: Copilot CLI smoke check
        if: steps.route.outputs.process == 'true'
        run: |
          copilot --version
          copilot --help >/dev/null

      - name: Run Copilot AI review (read-only)
        if: steps.route.outputs.process == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            -s \
            --no-ask-user \
            --disable-builtin-mcps \
            --available-tools='view,grep,glob' \
            --allow-tool='read' \
            --deny-tool='write' \
            --deny-tool='shell' \
            < inbox-ai-prompt.md \
            > inbox-ai-review-raw.txt

      - name: Validate AI JSON and apply governance overrides
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-apply-ai-review \
            --issue-number "${{ github.event.issue.number }}" \
            --ai-review-file inbox-ai-review-raw.txt

      - name: Product validation
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py validate

      - name: Product review
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py review

      - name: Persist Product Foundation state
        if: steps.route.outputs.process == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/inbox product/generated product/review product/research product/requirements product/decisions product/implementation
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: process inbox issue #${{ github.event.issue.number }}"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Build issue review comment
        if: steps.route.outputs.process == 'true'
        run: |
          python scripts/product/product_cli.py inbox-issue-review \
            --issue-number "${{ github.event.issue.number }}" \
            --output-file product-review-comment.md

      - name: Upsert review comment
        if: steps.route.outputs.process == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- LIBRECARE_PRODUCT_REVIEW -->';
            const body = fs.readFileSync('product-review-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  inbox-decision:
    if: github.event_name == 'issue_comment' && contains(join(github.event.issue.labels.*.name, ','), 'product-inbox')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Save GitHub event payload
        run: |
          cat "$GITHUB_EVENT_PATH" > github-event.json

      - name: Apply human decision command
        run: |
          python scripts/product/product_cli.py inbox-handle-decision \
            --event-file github-event.json \
            --repo-owner "${{ github.repository_owner }}" | tee decision-output.txt

      - name: Sync implementation handoff after /accept
        if: github.event.comment.body == '/accept'
        id: handoff
        continue-on-error: true
        env:
          COPILOT_AGENT_LOGIN: copilot-swe-agent[bot]
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          # Agent assignment payload is sent via GraphQL agentAssignment in product_cli.py.
          python scripts/product/product_cli.py inbox-sync-implementation-handoff \
            --event-file github-event.json \
            --repo-owner="${{ github.repository_owner }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --github-token "$GITHUB_TOKEN" \
            --copilot-assignment-token "$COPILOT_AGENT_USER_TOKEN" \
            --base-branch master \
            --output-file handoff-result.json

      - name: Report implementation handoff result
        if: github.event.comment.body == '/accept'
        id: handoff_summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('handoff-result.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          result = str(data.get('handoff_result') or ('HANDOFF_BLOCKED' if data.get('blocked') else 'HANDOFF_FAILED'))
          issue_number = str(data.get('implementation_issue_number') or '')
          issue_url = str(data.get('implementation_issue_url') or '')
          assigned = str(bool(data.get('copilot_real_assignee_confirmed'))).lower()
          failure_reason = str(data.get('failure_reason') or data.get('reason') or '')[:280]

          print('IMPLEMENTATION_HANDOFF_RESULT:')
          print(f"HANDOFF_RESULT: {result}")
          print(f"IMPLEMENTATION_ISSUE_NUMBER: {issue_number}")
          print(f"IMPLEMENTATION_ISSUE_URL: {issue_url}")
          print(f"COPILOT_AGENT_ASSIGNED: {assigned}")
          if failure_reason:
              print(f"HANDOFF_FAILURE_REASON: {failure_reason}")

          output = Path(os.environ['GITHUB_OUTPUT'])
          output.write_text("\n".join([
              f"handoff_result={result}",
              f"issue_number={issue_number}",
              f"issue_url={issue_url}",
              f"copilot_assigned={assigned}",
              f"failure_reason={failure_reason}",
          ]) + "\n", encoding='utf-8')
          PY

      - name: Upsert handoff assignment status comment
        if: github.event.comment.body == '/accept'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('handoff-result.json')) {
              core.info('No handoff payload generated.');
              return;
            }
            const payload = JSON.parse(fs.readFileSync('handoff-result.json', 'utf8'));
            if (!payload.comment_markdown) {
              core.info('No handoff comment required.');
              return;
            }
            const marker = '<!-- LIBRECARE_COPILOT_ASSIGNMENT_STATUS -->';
            const body = payload.comment_markdown;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Product validation
        run: |
          python scripts/product/product_cli.py validate

      - name: Product review
        run: |
          python scripts/product/product_cli.py review

      - name: Persist Product Foundation state
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/inbox product/generated product/review product/research product/requirements product/decisions product/implementation
          if git diff --cached --quiet; then
            echo "No Product Foundation changes to commit."
          else
            git commit -m "product: apply inbox decision issue #${{ github.event.issue.number }}"
            git pull --rebase origin "$BRANCH_NAME"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Fail workflow if implementation handoff failed
        if: github.event.comment.body == '/accept' && steps.handoff_summary.outputs.handoff_result == 'HANDOFF_FAILED'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('handoff-result.json').read_text(encoding='utf-8')) if Path('handoff-result.json').exists() else {}
          reason = str(data.get('failure_reason') or data.get('reason') or 'Implementation handoff failed.')[:280]
          print(f'HANDOFF_FAILED: {reason}')
          raise SystemExit(1)
          PY

      - name: Upsert decision result comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- LIBRECARE_PRODUCT_DECISION -->';
            const output = fs.existsSync('decision-output.txt')
              ? fs.readFileSync('decision-output.txt', 'utf8').trim()
              : 'Brak wyniku komendy decyzyjnej.';
            const body = `${marker}\n${output}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
