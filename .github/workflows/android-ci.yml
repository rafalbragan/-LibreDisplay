name: Android CI

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "scripts/test-fast.sh"
      - "scripts/verify-environment.sh"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  fast-suite:
    name: Fast test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/*.sh

      - name: Verify build environment
        run: bash ./scripts/verify-environment.sh

      - name: Run fast suite
        run: bash ./scripts/test-fast.sh

      - name: Upload build outputs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librecare-fast-suite
          path: |
            ci-artifacts/**
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

