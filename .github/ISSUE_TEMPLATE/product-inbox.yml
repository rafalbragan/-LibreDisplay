name: LibreCare — skrzynka produktu
description: "Zgłoś obserwację, problem lub pomysł dotyczący LibreCare."
title: "[Skrzynka Produktowa] "
labels:
  - product-inbox
body:
  - type: dropdown
    id: type
    attributes:
      label: Typ zgłoszenia
      options:
        - Problem
        - Obserwacja
        - Pomysł
        - Pytanie / niepewność
    validations:
      required: true

  - type: dropdown
    id: persona
    attributes:
      label: Persona użytkownika
      options:
        - Opiekun
        - Senior
        - Lekarz
        - Wspólne / nie wiem
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Moduł
      options:
        - Główna / Monitoring
        - Analiza
        - Kontekst zdarzeń
        - Ustawienia
        - Powiadomienia
        - Inne / nie wiem
    validations:
      required: false

  - type: textarea
    id: notice
    attributes:
      label: Co zauważyłeś(-aś) / czego potrzebujesz?
      placeholder: "Opisz co zauważyłeś(-aś) albo czego potrzebujesz."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Dlaczego to ważne?
      placeholder: "Dlaczego to jest ważne dla Ciebie lub użytkownika?"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Kontekst / przykład
      placeholder: "Przykład, ekran, sytuacja, kiedy to się pojawia."
    validations:
      required: false

