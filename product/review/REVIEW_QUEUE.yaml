  CAND-INBOX-GH-000029:
    title: 'Inbox INBOX-GH-000029 #29'
    persona: caregiver
    module: Home / Monitoring
    problem_or_opportunity: Zgłoszenie opisuje crash aplikacji po wybraniu z Home
      osoby nieaktywnej lub bez świeżych danych. Zamiast widoku Monitoring aplikacja
      się zamyka. To defekt niezawodności na głównej ścieżce opiekuna, a nie nowa
      funkcja. Dotyka bezpieczeństwa, bo opiekun traci bieżący obraz sytuacji i może
      uznać brak danych za brak ryzyka. Dowody są słabe. Jest jedno zgłoszenie, bez
      stack trace, wersji aplikacji i kroków odtworzenia. W product/research/test-runs,
      product/research/observations i product/bugs nie znalazłem żadnego wpisu o tej
      ścieżce. Oczekiwane zachowanie (status, czas ostatniego poprawnego odczytu)
      częściowo pokrywa się z zaakceptowanym REQ-0002.
    proposed_requirement: 'Krok 1 (bug, nie wymaganie UX): zarejestrować kandydata
      na bug i odtworzyć awarię. Ścieżka to Home -> osoba nieaktywna lub bez odczytu
      -> Monitoring, na danych rzeczywistych i w Demo, ze zebraniem logu awarii. Po
      potwierdzeniu wykonać wąską poprawkę przyczyny źródłowej, bez nowego zachowania,
      plus testy regresyjne ViewModel/nawigacji dla pustych danych. Krok 2 (osobny
      kandydat wymagania, decyzja człowieka): zaprojektować jawne stany (nieaktywne,
      brak odczytu, nieaktualne, problem połączenia) z czasem ostatniego poprawnego
      odczytu, jako rozszerzenie REQ-0002. Brak danych nie może być pokazany jako
      stan bezpieczny. Aplikacja nie może z niego wyprowadzać rekomendacji leczenia
      ani dawkowania.'
    expected_user_value: 'Wysoka dla opiekuna: niezawodny dostęp do ekranu osoby także
      bez świeżych danych i brak fałszywego poczucia bezpieczeństwa. Wartość ma charakter
      niezawodności i zaufania. Wartość rozróżnienia stanów jest na razie hipotetyczna,
      bo brak obserwacji.'
    alternative: Nie tworzyć nowego wymagania. Odtworzyć crash lokalnie lub w Demo
      z osobą bez odczytów, odczytać log awarii i dodać test ViewModel/Compose dla
      pustych danych. Naprawić samą przyczynę (np. null lub pusta lista). Przy braku
      danych pokazać istniejący tekst „brak danych” z ostatnim znanym czasem odczytu.
      Rozróżnienie czterech stanów odłożyć do osobnej decyzji.
    counterargument: Zgłoszenie jest jednoosobowe, bez śladu stosu i bez odtworzenia.
      Crash mógł zostać naprawiony wcześniej, zależeć od konkretnego stanu lokalnej
      bazy albo od środowiska. Zgłoszenie łączy też defekt (crash) z rozbudową UX
      (komunikaty stanu), która pokrywa się z REQ-0002 i nie powinna wchodzić do poprawki.
      Przyjęcie bez odtworzenia grozi poprawką objawu zamiast przyczyny. W fazie foundation
      (DEC-0005) szeroka przebudowa Monitoring odciągałaby uwagę.
    safety_impact: HIGH
    proposed_priority: P0
    human_decision: PENDING
