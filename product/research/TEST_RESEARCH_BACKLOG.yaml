    reason: "Zgłoszenie dotyczy ergonomii i spójności sterowania wykresem glikemii (zakres 1h–24h, przesuwanie, zoom, tooltip, sterowanie bez gestów) na Home i w pełnoekranowej historii. Jest to zbiór 9 punktów o różnym charakterze, a nie jeden zweryfikowany problem. Zgłaszający sam zaznacza, że w kodzie istnieją selektor zakresu i obsługa gestów, a UX na małych ekranach i przy większej czcionce oraz kompletność sterowania bez gestów są „do reprodukcji”. W Product Foundation nie ma żadnego przebiegu testowego ani obserwacji dotyczących interakcji z wykresem, więc nie ma dowodu na realny problem użytkownika. Największy brak to dowód, nie funkcja."
