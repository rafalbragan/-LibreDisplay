          ## CEL UŻYTKOWNIKA

          Opiekun i lekarz szybciej i pewniej analizuja przebieg glikemii, bez mylenia
          danych przestarzalych z biezacymi.


          ## ZAKRES

          Zaimplementowac zatwierdzony redesign nawigacji wykresu dla Home i Monitoring:
          zakresy 1h-24h, pan/zoom, mini-nawigator, tooltip z data/godzina/jednostka,
          powrot do najnowszych danych, oraz sterowanie bez gestow, bez zmian progow
          medycznych.


          ## POZA ZAKRESEM

          - Nie rozszerzaj zakresu poza zaakceptowane wymaganie kanoniczne.

          - Nie używaj surowego tekstu z Product Inbox jako źródła prawdy dla zakresu
          implementacji.

          - Nie zmieniaj logiki leczenia, bezpieczeństwa ani innych niepowiązanych
          funkcji, jeśli REQ nie wymaga tego wprost.

          - Nie uruchamiaj Firebase automatycznie, chyba że kanoniczne wymaganie wyraźnie
          tego wymaga.


          ## KRYTERIA AKCEPTACJI

          - Zaimplementowac zatwierdzony redesign nawigacji wykresu dla Home i Monitoring:
          zakresy 1h-24h, pan/zoom, mini-nawigator, tooltip z data/godzina/jednostka,
          powrot do najnowszych danych, oraz sterowanie bez gestow, bez zmian progow
          medycznych.

          - Nie rozszerzono zakresu poza kanoniczne wymaganie.

          - Dodano lub zaktualizowano testy oraz utrzymano brak regresji.


